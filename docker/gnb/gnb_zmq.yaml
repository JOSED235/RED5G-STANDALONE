# Plantilla: los marcadores ${...} se sustituyen al arrancar el contenedor con los
# valores de .env (docker/comun/renderizar_plantilla.sh). No edite valores de red aquí.

cu_cp:
  amf:
    addr: ${OPEN5GS_IP}       # AMF (contenedor open5gs)
    port: 38412
    bind_addr: ${GNB_IP}      # N2: dirección local del gNB en la red Docker
    supported_tracking_areas:
      - tac: ${TAC}
        plmn_list:
          - plmn: "${MCC}${MNC}"
            tai_slice_support_list:
              - sst: ${SST}

cu_up:
  ngu:
    socket:
      - bind_addr: ${GNB_IP}  # N3: el valor por defecto (127.0.0.1) rompe GTP-U entre contenedores

# Radio virtual ZMQ: cada extremo enlaza (bind) su puerto TX y se conecta al TX del otro.
#   gNB TX -> bind GNB_IP:2000   |   gNB RX <- connect al TX del UE (UE_IP:2001)
ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://${GNB_IP}:2000,rx_port=tcp://${UE_IP}:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "${MCC}${MNC}"
  tac: ${TAC}
  prach:
    prach_config_index: 1
  pdcch:
    common:
      ss0_index: 0
      coreset0_index: 12
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
  # Rango de MCS del scheduler (PDSCH_*/PUSCH_*_MCS en .env). 0..28 = adaptación de enlace;
  # mínimo = máximo fija el MCS (prueba P8, python -m banco p8).
  pdsch:
    mcs_table: qam64
    min_ue_mcs: ${PDSCH_MIN_MCS}
    max_ue_mcs: ${PDSCH_MAX_MCS}
  pusch:
    mcs_table: qam64
    min_ue_mcs: ${PUSCH_MIN_MCS}
    max_ue_mcs: ${PUSCH_MAX_MCS}

pcap:
  ngap_enable: true
  ngap_filename: /capturas/gnb_ngap.pcap
  # El PCAP de N3 por paquete satura la cola de tareas del gNB y reduce el caudal;
  # el plano de usuario N3 se captura desde el Core (manage_lab.ps1 pcap).
  n3_enable: false

log:
  filename: /capturas/gnb.log
  # info en todas las capas genera ~2 MB/min y resta CPU al procesamiento en tiempo real;
  # se deja warning por defecto e info solo en la señalización (RRC, NGAP).
  all_level: warning
  rrc_level: info
  ngap_level: info

# Tabla de métricas por UE cada segundo en la salida del contenedor (docker compose logs gnb):
# CQI, MCS, caudal, ACK/NACK (BLER) en DL y UL. Evidencia para las pruebas P7/P8.
metrics:
  autostart_stdout_metrics: true
