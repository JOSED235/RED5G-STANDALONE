# Plantilla: los marcadores ${...} se sustituyen al arrancar el contenedor con los
# valores de .env (docker/comun/renderizar_plantilla.sh). No edite valores de red aquí.

logger:
  file:
    path: /var/log/open5gs/upf.log
  level: info

global:
  max:
    ue: 1024

upf:
  pfcp:
    server:
      - address: 127.0.0.7
  gtpu:
    server:
      - address: ${OPEN5GS_IP}   # Dirección N3 que el SMF anuncia al gNB (no puede ser 0.0.0.0)
  session:
    - subnet: 10.45.0.0/16
      gateway: 10.45.0.1
      dev: ogstun
  metrics:
    server:
      - address: 127.0.0.7
        port: 9090
