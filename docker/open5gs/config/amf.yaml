# Plantilla: los marcadores ${...} se sustituyen al arrancar el contenedor con los
# valores de .env (docker/comun/renderizar_plantilla.sh). No edite valores de red aquí.

logger:
  file:
    path: /var/log/open5gs/amf.log
  level: info

global:
  max:
    ue: 1024

amf:
  sbi:
    server:
      - address: 127.0.0.5
        port: 7777
    client:
      scp:
        - uri: http://127.0.0.200:7777
  ngap:
    server:
      - address: ${OPEN5GS_IP}   # N2 expuesto en la red Docker hacia el gNB
  metrics:
    server:
      - address: 127.0.0.5
        port: 9090
  guami:
    - plmn_id:
        mcc: ${MCC}
        mnc: ${MNC}
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: ${MCC}
        mnc: ${MNC}
      tac: ${TAC}
  plmn_support:
    - plmn_id:
        mcc: ${MCC}
        mnc: ${MNC}
      s_nssai:
        - sst: ${SST}
  # Orden de preferencia de algoritmos NAS (AMF_INTEGRITY_ORDER / AMF_CIPHERING_ORDER en .env).
  # NIA2 se prioriza para la integridad. El cifrado prioriza NEA0 en la Fase 2 porque el srsUE
  # no completa el registro con NEA1/2/3; en la Fase 3 (terminal comercial) se usa NEA2 primero.
  security:
    integrity_order : [ ${AMF_INTEGRITY_ORDER} ]
    ciphering_order : [ ${AMF_CIPHERING_ORDER} ]
  network_name:
    full: Open5GS
    short: 5GS
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
