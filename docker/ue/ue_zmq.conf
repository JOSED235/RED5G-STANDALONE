[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
# El UE enlaza (bind) su puerto TX 2001 y se conecta al TX del gNB (172.20.0.4:2000)
device_args = tx_port=tcp://172.20.0.5:2001,rx_port=tcp://172.20.0.4:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = nas
nas_filename = /capturas/ue_nas.pcap

[usim]
mode = soft
algo = milenage
opc = 63BFA50EE6523365FF14C1F45F88737D
k = 00112233445566778899aabbccddeeff
imsi = 001010123456780
imei = 353490069873319

[nas]
apn = internet
apn_protocol = ipv4

[gw]
# El contenedor Docker ya aísla la pila de red; no se requiere netns adicional
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[log]
# En info, PHY/MAC generan ~20 MB por minuto y desbordan la cola de logs;
# se dejan en warning y se conserva info en las capas de señalización (RRC, NAS, USIM).
all_level = warning
rrc_level = info
nas_level = info
usim_level = info
all_hex_limit = 0
filename = /capturas/ue.log

[rrc]
release = 15
ue_category = 4
