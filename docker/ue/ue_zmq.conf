# Plantilla: los marcadores ${...} se sustituyen al arrancar el contenedor con los
# valores de .env (docker/comun/renderizar_plantilla.sh). No edite valores de red aquí.

[rf]
freq_offset = 0
tx_gain = 50
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
# El UE enlaza (bind) su puerto TX 2001 y se conecta al TX del gNB (GNB_IP:2000)
device_args = tx_port=tcp://${UE_IP}:2001,rx_port=tcp://${GNB_IP}:2000,base_srate=23.04e6

[rat.eutra]
dl_earfcn = 2850
nof_carriers = 0

[rat.nr]
bands = 3
nof_carriers = 1
max_nof_prb = 106
nof_prb = 106

[pcap]
enable = nas
nas_filename = /capturas/ue_nas.pcap

[usim]
mode = soft
algo = milenage
opc = ${UE_OPC}
k = ${UE_K}
imsi = ${UE_IMSI}
imei = ${UE_IMEI}

[nas]
apn = ${DNN}
apn_protocol = ipv4

[gw]
# El contenedor Docker ya aísla la pila de red; no se requiere netns adicional
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[log]
# En info, PHY/MAC generan ~20 MB por minuto y desbordan la cola de logs;
# se dejan en warning y se conserva info en las capas de señalización (RRC, NAS, USIM).
all_level = warning
rrc_level = info
nas_level = info
usim_level = info
all_hex_limit = 0
filename = /capturas/ue.log

[rrc]
release = 15
ue_category = 4
