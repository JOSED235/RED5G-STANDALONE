services:
  mongodb:
    image: mongo:6.0
    container_name: red5g-mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=open5gs
    volumes:
      - mongodb_data:/data/db
      - ./docker/open5gs/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      # mongosh consume casi un núcleo al arrancar: sondeo rápido solo durante el arranque
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 3s
    networks:
      red5g_net:
        ipv4_address: 172.20.0.2

  open5gs:
    build:
      context: ./docker/open5gs
      dockerfile: Dockerfile
    image: red5g-open5gs:latest
    container_name: red5g-open5gs
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
    # N2 (SCTP), N3 y N4 solo se usan dentro de red5g_net: no se publican en el host
    # (Docker Desktop no publica SCTP de forma fiable y no es necesario).
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MONGO_HOST=172.20.0.2
    volumes:
      - ./capturas:/capturas
    networks:
      red5g_net:
        ipv4_address: 172.20.0.3

  webui:
    build:
      context: ./docker/webui
      dockerfile: Dockerfile
    image: red5g-webui:latest
    container_name: red5g-webui
    restart: unless-stopped
    ports:
      - "9999:9999"        # Open5GS WebUI (http://localhost:9999 - admin / 1423)
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - DB_URI=mongodb://172.20.0.2/open5gs
      - HOSTNAME=0.0.0.0
    networks:
      red5g_net:
        ipv4_address: 172.20.0.6

  gnb:
    build:
      context: ./docker/gnb
      dockerfile: Dockerfile
    image: red5g-gnb:latest
    container_name: red5g-gnb
    restart: unless-stopped
    tty: true   # sin TTY el gNB deja su salida en búfer y no aparece en 'docker compose logs'
    cap_add:
      - SYS_NICE
    depends_on:
      open5gs:
        condition: service_healthy   # AMF escuchando NGAP (SCTP 38412)
    volumes:
      - ./capturas:/capturas
    networks:
      red5g_net:
        ipv4_address: 172.20.0.4

  ue:
    build:
      context: ./docker/ue
      dockerfile: Dockerfile
    image: red5g-ue:latest
    container_name: red5g-ue
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    depends_on:
      - gnb
    volumes:
      - ./capturas:/capturas
    healthcheck:
      test: ["CMD-SHELL", "ip -4 addr show tun_srsue | grep -q 'inet 10.45.'"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 3
    networks:
      red5g_net:
        ipv4_address: 172.20.0.5

networks:
  red5g_net:
    name: red5g_net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/24

volumes:
  mongodb_data:
